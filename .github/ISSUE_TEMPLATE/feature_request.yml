name: Feature request
description: Suggest a focused improvement with fictional examples.
title: 'feat: '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the use case without personal or property data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Include assumptions, units and expected behavior where relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
