name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:smoke
      - name: Tag matches package.json
        run: node --input-type=module -e "import fs from 'node:fs'; const {version} = JSON.parse(fs.readFileSync('package.json', 'utf8')); if (process.env.GITHUB_REF_NAME !== 'v' + version) { console.error('Tag must match package.json version'); process.exit(1); }"
      - run: npm publish --provenance --access public
